# Build AdaptFit and publish it to GitHub Pages (free HTTPS hosting).
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Runs on every push to main, or manually from the Actions tab ("Run workflow").
# The build uses a relative base (vite.config.ts `base: './'`), so it works at
# https://<user>.github.io/<repo>/ without any extra configuration.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Optional anonymous usage counter (server/pings). Set the repository variable PINGS_URL
      # (Settings → Secrets and variables → Actions → Variables) to turn on the opt-in switch.
      - run: npm run build
        env:
          VITE_PINGS_URL: ${{ vars.PINGS_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
